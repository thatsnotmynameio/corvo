[project]
name = "corvo"
version = "0.1.0"
description = "corvo's API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Matheus Guilarducci", email = "mguilarducci@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "docker>=7.2.0",
    "fastapi>=0.143.0",
    "hatchet-sdk>=1.42.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

# The worker's entry point, as Hatchet's Python quickstart declares its own.
[project.scripts]
corvo-worker = "corvo.worker.worker:main"

# corvo runs on Linux only: its image, CI, and the rootless Podman its agents
# run on. The lock resolves for Linux alone, so it carries no package another
# platform alone needs, such as docker's pywin32.
[tool.uv]
environments = ["sys_platform == 'linux'"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "prek>=0.5.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "types-docker>=7.2.0.20261006",
    "zizmor>=1.30.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-asyncio as Hatchet's own suite sets it: async tests without a
# marker, and fixtures on one loop for the session, where the Hatchet
# client's connections live.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
