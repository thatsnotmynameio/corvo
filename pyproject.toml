[project]
name = "corvo"
version = "0.1.0"
description = "corvo's API."
readme = "README.md"
authors = [
    { name = "Matheus Guilarducci", email = "mguilarducci@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "prek>=0.5.5",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "zizmor>=1.30.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
