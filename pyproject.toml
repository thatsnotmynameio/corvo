[project]
name = "corvo"
version = "0.1.0"
description = "corvo's Hatchet workers and the agents they run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Matheus Guilarducci", email = "mguilarducci@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "claude-agent-sdk==0.2.177",
    "hatchet-sdk>=1.44.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.6",
]

# The worker's entry point, as Hatchet's Python quickstart declares its own.
[project.scripts]
corvo-worker = "corvo.worker.worker:main"
# The SDK's cli_path in the agent worker: it starts the engine in a bubblewrap
# sandbox of its own.
corvo-agent-sandbox = "corvo.worker.agent_runtime.sandbox:main"

# corvo runs on Linux only: its image and CI. The lock resolves for Linux
# alone, so it carries no package another platform alone needs.
[tool.uv]
environments = ["sys_platform == 'linux'"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "prek>=0.5.9",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
    "zizmor>=1.32.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-asyncio as Hatchet's own suite sets it: async tests without a
# marker, and fixtures on one loop for the session, where the Hatchet
# client's connections live.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "fake_cli: runs the SDK's real transport, on the fake claude CLI only",
]
