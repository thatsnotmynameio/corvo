# mypy's configuration. The organization's CI reads mypy.ini, never
# [tool.mypy] in pyproject.toml, and takes it from a pull request's base
# commit: a change here applies once it merges.
[mypy]
strict = true
plugins = pydantic.mypy
files = src, tests
# SQLAlchemy leaves some of its constructors untyped, such as a dialect's.
untyped_calls_exclude = sqlalchemy
