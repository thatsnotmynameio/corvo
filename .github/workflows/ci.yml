# Each push to main: the Python project's checks, through the organization's
# workflow (thatsnotmynameio/github-actions' python.yml), on Linux. It checks
# that uv.lock is current, runs ruff's formatting and lint and mypy, then the
# tests with coverage, in a job for each of Trunk's test collections, and the
# coverage floor of .github/python.yml; ruff's findings go to code scanning
# and the tests' results to Trunk. The build of the package and image follows.
# The push gives code scanning the analysis of main that a pull request's ruff
# alerts are compared against, and Trunk the results of main. Without
# pyproject.toml there is nothing to check.
# On a pull request the organization's ruleset runs the same workflow, as the
# checks "tnmn.io: python (…)", with .github/python.yml and ruff.toml from the
# base commit: a change to them applies once it merges. actionlint runs on
# every pull request the same way, as the check "tnmn.io: actionlint".
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Each commit gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  python:
    name: python
    permissions:
      contents: read
      security-events: write # uploads ruff's findings to code scanning
    uses: thatsnotmynameio/github-actions/.github/workflows/python.yml@3615f1d6cbd08e5797a4fa1318a775cc1c62931e # v0.4.0
    secrets:
      # Trunk's organization token: main's test results go to Trunk.
      TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
