# The organization's Python checks (thatsnotmynameio/github-actions'
# python.yml) read this file from a pull request's base commit: a change here
# applies once it merges.
# The least total coverage, in percent, of the statements and branches the
# tests cover.
coverage: 90
# Trunk Flaky Tests' test collections, each with the pytest arguments that
# pick its tests: one for each directory of tests/, and the last one for the
# rest (test_settings.py, test_import_boundaries.py and any test outside them).
# Each runs in a job of its own, and its results go to its collection.
# While the tests move from tests/{area} to tests/unit/corvo/{area}, each
# collection is every test minus the others', in both layouts: pytest refuses
# a path that does not exist but takes an --ignore of one. The move puts each
# collection back on its own path.
trunk:
  - collection: YJ9od0SO # corvo-agents
    pytest: [tests, --ignore=tests/core, --ignore=tests/unit/corvo/core, --ignore=tests/integration, --ignore=tests/server, --ignore=tests/unit/corvo/server, --ignore=tests/worker, --ignore=tests/unit/corvo/worker, --ignore=tests/test_settings.py, --ignore=tests/test_import_boundaries.py, --ignore=tests/unit/corvo/test_settings.py, --ignore=tests/unit/corvo/test_import_boundaries.py]
  - collection: 29TSvQtU # corvo-core
    pytest: [tests, --ignore=tests/agents, --ignore=tests/unit/corvo/agents, --ignore=tests/integration, --ignore=tests/server, --ignore=tests/unit/corvo/server, --ignore=tests/worker, --ignore=tests/unit/corvo/worker, --ignore=tests/test_settings.py, --ignore=tests/test_import_boundaries.py, --ignore=tests/unit/corvo/test_settings.py, --ignore=tests/unit/corvo/test_import_boundaries.py]
  - collection: iEWIqdL3 # corvo-integration
    pytest: [tests/integration]
  - collection: yQxWQ7gk # corvo-server
    pytest: [tests, --ignore=tests/agents, --ignore=tests/unit/corvo/agents, --ignore=tests/core, --ignore=tests/unit/corvo/core, --ignore=tests/integration, --ignore=tests/worker, --ignore=tests/unit/corvo/worker, --ignore=tests/test_settings.py, --ignore=tests/test_import_boundaries.py, --ignore=tests/unit/corvo/test_settings.py, --ignore=tests/unit/corvo/test_import_boundaries.py]
  - collection: Sz6YOghs # corvo-worker
    pytest: [tests, --ignore=tests/agents, --ignore=tests/unit/corvo/agents, --ignore=tests/core, --ignore=tests/unit/corvo/core, --ignore=tests/integration, --ignore=tests/server, --ignore=tests/unit/corvo/server, --ignore=tests/test_settings.py, --ignore=tests/test_import_boundaries.py, --ignore=tests/unit/corvo/test_settings.py, --ignore=tests/unit/corvo/test_import_boundaries.py]
  - collection: IJbTawYj # corvo
    pytest: [tests, --ignore=tests/agents, --ignore=tests/unit/corvo/agents, --ignore=tests/core, --ignore=tests/unit/corvo/core, --ignore=tests/integration, --ignore=tests/server, --ignore=tests/unit/corvo/server, --ignore=tests/worker, --ignore=tests/unit/corvo/worker]
