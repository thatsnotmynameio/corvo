# Weekly pull requests for new versions of the actions, pinned by SHA, and of
# the Python dependencies in uv.lock. A version is proposed only once it is 7
# days old, so a compromised release has time to be pulled.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    groups:
      python:
        patterns: ["*"]
