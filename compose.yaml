# The app and its PostgreSQL, run as in production, after Docker's "Use
# Compose in production": the code stays in the image, only the app's port
# reaches the host, and the services restart on their own.
# POSTGRES_PASSWORD comes from the environment or from .env (see .env.example).
services:
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: corvo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Variable not set}
      POSTGRES_DB: corvo
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corvo -d corvo"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  # The migrations run once, before the app starts, so a restart of the app
  # does not run them again.
  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      CORVO_DATABASE_URL: postgresql+asyncpg://corvo:${POSTGRES_PASSWORD:?Variable not set}@db:5432/corvo
    command: ["alembic", "-c", "src/corvo/server/database/alembic.ini", "upgrade", "head"]

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully
    environment:
      CORVO_DATABASE_URL: postgresql+asyncpg://corvo:${POSTGRES_PASSWORD:?Variable not set}@db:5432/corvo
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health")
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
