# The app and its PostgreSQL, and Hatchet and its own, run as in production,
# after Docker's "Use Compose in production": the code stays in the image,
# only the app's and Hatchet's dashboard's ports reach the host, and the
# services restart on their own.
# Their settings come from the environment or from .env (see .env.example).

# The image and the database settings migrate and app share.
x-corvo: &corvo
  build: .
  environment:
    CORVO_POSTGRES_HOST: db
    CORVO_POSTGRES_USER: ${POSTGRES_USER:?Variable not set}
    CORVO_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Variable not set}
    CORVO_POSTGRES_DATABASE: ${POSTGRES_DB:?Variable not set}

# Hatchet's DATABASE_URL. hatchet-migrate reads no other setting, so the user
# and the password go in the URL and must not need escaping (see
# .env.example).
x-hatchet-database-url: &hatchet-database-url "postgres://${HATCHET_POSTGRES_USER:?Variable not set}:${HATCHET_POSTGRES_PASSWORD:?Variable not set}@hatchet-db:5432/${HATCHET_POSTGRES_DB:?Variable not set}?sslmode=disable"

# The settings hatchet-setup writes to the config, given to the engine and the
# dashboard too: the config leaves out a setting whose value is false, such as
# SERVER_ALLOW_SIGNUP, which then falls back to its default, true.
x-hatchet-environment: &hatchet-environment
  DATABASE_URL: *hatchet-database-url
  SERVER_MSGQUEUE_KIND: ${HATCHET_MSGQUEUE_KIND:?Variable not set}
  SERVER_URL: ${HATCHET_SERVER_URL:?Variable not set}
  SERVER_AUTH_COOKIE_DOMAIN: ${HATCHET_AUTH_COOKIE_DOMAIN:?Variable not set}
  SERVER_AUTH_COOKIE_INSECURE: ${HATCHET_AUTH_COOKIE_INSECURE:?Variable not set}
  SERVER_ALLOW_SIGNUP: ${HATCHET_ALLOW_SIGNUP:?Variable not set}
  SERVER_GRPC_BIND_ADDRESS: ${HATCHET_GRPC_BIND_ADDRESS:?Variable not set}
  SERVER_GRPC_INSECURE: ${HATCHET_GRPC_INSECURE:?Variable not set}
  SERVER_GRPC_BROADCAST_ADDRESS: ${HATCHET_GRPC_BROADCAST_ADDRESS:?Variable not set}
  SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: ${HATCHET_INTERNAL_GRPC_BROADCAST_ADDRESS:?Variable not set}

services:
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Variable not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Variable not set}
      POSTGRES_DB: ${POSTGRES_DB:?Variable not set}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  # The migrations run once, before the app starts, so a restart of the app
  # does not run them again.
  migrate:
    <<: *corvo
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "-c", "src/corvo/server/database/alembic.ini", "upgrade", "head"]

  app:
    <<: *corvo
    restart: always
    depends_on:
      db:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health")
      interval: 10s
      timeout: 5s
      retries: 5

  # The Hatchet worker, from the app's image. It reaches the engine at the
  # address in its token, HATCHET_GRPC_BROADCAST_ADDRESS, and depends on the
  # engine as Hatchet's Docker Compose guide says. Without TLS on the engine's
  # gRPC, its own TLS is off too.
  worker:
    build: .
    restart: always
    command: ["corvo-worker"]
    environment:
      CORVO_HATCHET_TOKEN: ${HATCHET_CLIENT_TOKEN?Variable not set}
      CORVO_HATCHET_TLS_STRATEGY: ${HATCHET_CLIENT_TLS_STRATEGY:?Variable not set}
    depends_on:
      hatchet-engine:
        condition: service_started

  # The agent worker (KTD13, KTD18): corvo-worker serving the agents profile,
  # which runs each agent session in a bubblewrap sandbox and a cgroup of its
  # own. It holds the Hatchet token but neither the database password nor the
  # Claude credential, and reaches only the engine and the credential proxy,
  # on the internal agents network. Its start checks its isolation and exits
  # when that fails, so it registers no agent task it cannot isolate.
  #
  # Its entrypoint runs as root only to hand uid 1000 the container's cgroup
  # subtree, which writable-cgroups makes writable. The seccomp profile is
  # Docker's plus the calls bubblewrap needs (KTD23), and systempaths lets
  # bubblewrap mount a /proc of its own. tini reaps what an ended session
  # leaves. The container's own limits leave room for one session past the
  # cap's and the worker, under each session's cgroup.
  agent-worker:
    build:
      context: .
      target: agent-worker
    restart: always
    init: true
    environment:
      CORVO_WORKER_PROFILE: agents
      CORVO_HATCHET_TOKEN: ${HATCHET_CLIENT_TOKEN?Variable not set}
      CORVO_HATCHET_TLS_STRATEGY: ${HATCHET_CLIENT_TLS_STRATEGY:?Variable not set}
      # The engine, on the agents network, whatever address the token holds.
      HATCHET_CLIENT_HOST_PORT: hatchet-engine:7070
      HATCHET_CLIENT_WORKER_HEALTHCHECK_ENABLED: "True"
      CORVO_AGENT_ROOT: /var/lib/corvo/agents
      # The sessions' ANTHROPIC_BASE_URL, and which placeholder they send:
      # the proxy puts the credential in its place.
      CORVO_AGENT_PROXY_URL: http://claude-proxy:8080
      CORVO_AGENT_CREDENTIAL_KIND: ${CORVO_AGENT_CREDENTIAL_KIND:?Variable not set}
    volumes:
      - agent-root:/var/lib/corvo/agents
    security_opt:
      - seccomp=src/corvo/worker/agent_runtime/seccomp.json
      - systempaths=unconfined
      - writable-cgroups=true
    # 3 sessions of AGENT_MEMORY and AGENT_PIDS_LIMIT, and the worker.
    mem_limit: 7g
    memswap_limit: 7g
    pids_limit: 1024
    # SIGTERM ends the in-flight sessions, then Hatchet waits for their runs
    # to fail (KTD19).
    stop_grace_period: 30s
    networks:
      - agents
    # As uid 1000, the worker's own user.
    healthcheck:
      test:
        - CMD
        - setpriv
        - --reuid=1000
        - --regid=1000
        - --clear-groups
        - --no-new-privs
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8001/health")
      interval: 10s
      timeout: 5s
      retries: 5
      # The start checks take up to 45 seconds.
      start_period: 60s
      start_interval: 2s
    depends_on:
      hatchet-engine:
        condition: service_started
      claude-proxy:
        condition: service_started

  # The credential proxy (KTD22): Caddy, with src/corvo/agents/Caddyfile, the
  # only service holding the Claude credential. It forwards the sessions'
  # Messages API calls to the Claude API with the credential in place of
  # their placeholder, and nothing else. It is on agents for the agent worker
  # and on egress, a network of its own, for its way out: on default, every
  # service there could spend through it. Its admin API is off.
  claude-proxy:
    image: caddy:2.11.7-alpine
    restart: always
    environment:
      CORVO_AGENT_CREDENTIAL: ${CORVO_AGENT_CREDENTIAL:?Variable not set}
      CORVO_AGENT_CREDENTIAL_KIND: ${CORVO_AGENT_CREDENTIAL_KIND:?Variable not set}
    volumes:
      - ./src/corvo/agents/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - egress
      - agents

  # Hatchet, after its Docker Compose guide
  # (https://docs.hatchet.run/self-hosting/docker-compose), with PostgreSQL as
  # its message queue in place of RabbitMQ. Its images are pinned to the
  # release GitHub marks as latest, the one Hatchet's docs point to.

  # Hatchet's own PostgreSQL. A crash Hatchet's queries set off restarts the
  # whole cluster (hatchet-dev/hatchet#5101), and Hatchet's CI runs on
  # PostgreSQL 17, so it does not share corvo's db. max_connections and
  # shm_size follow Hatchet's guide: its engine and API each pool up to 50
  # connections, and the default 64 MB of /dev/shm slows its queries down.
  hatchet-db:
    image: postgres:17
    restart: always
    command: ["postgres", "-c", "max_connections=500"]
    shm_size: 1g
    environment:
      POSTGRES_USER: ${HATCHET_POSTGRES_USER:?Variable not set}
      POSTGRES_PASSWORD: ${HATCHET_POSTGRES_PASSWORD:?Variable not set}
      POSTGRES_DB: ${HATCHET_POSTGRES_DB:?Variable not set}
    volumes:
      - hatchet-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  hatchet-migrate:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-migrate:v0.110.5
    command: ["/hatchet/hatchet-migrate"]
    environment:
      DATABASE_URL: *hatchet-database-url
    depends_on:
      hatchet-db:
        condition: service_healthy

  # Writes the config the engine and the dashboard read, on each start, from
  # Hatchet's settings above. The encryption keys and the cookie secrets are
  # generated once and kept in hatchet-config: without them, the API tokens
  # already issued stop working. It also creates the admin, once: a later
  # change to HATCHET_ADMIN_PASSWORD does not change the admin's password.
  hatchet-setup:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:v0.110.5
    command:
      - /hatchet/hatchet-admin
      - quickstart
      - --skip
      - certs
      - --generated-config-dir
      - /hatchet/config
      - --overwrite=false
    environment:
      <<: *hatchet-environment
      ADMIN_EMAIL: ${HATCHET_ADMIN_EMAIL:?Variable not set}
      ADMIN_PASSWORD: ${HATCHET_ADMIN_PASSWORD:?Variable not set}
    volumes:
      - hatchet-config:/hatchet/config
    depends_on:
      hatchet-db:
        condition: service_healthy
      hatchet-migrate:
        condition: service_completed_successfully

  # The engine's gRPC port stays off the host: only the workers in this
  # compose reach it, at HATCHET_GRPC_BROADCAST_ADDRESS.
  hatchet-engine:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-engine:v0.110.5
    restart: always
    command: ["/hatchet/hatchet-engine", "--config", "/hatchet/config"]
    environment: *hatchet-environment
    volumes:
      - hatchet-config:/hatchet/config
    # The agent worker reaches it on agents, the other workers on default.
    networks:
      - default
      - agents
    depends_on:
      hatchet-db:
        condition: service_healthy
        restart: true
      hatchet-setup:
        condition: service_completed_successfully

  hatchet-dashboard:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-dashboard:v0.110.5
    restart: always
    command: ["sh", "./entrypoint.sh", "--config", "/hatchet/config"]
    environment: *hatchet-environment
    volumes:
      - hatchet-config:/hatchet/config
    depends_on:
      hatchet-db:
        condition: service_healthy
        restart: true
      hatchet-setup:
        condition: service_completed_successfully
    ports:
      - "8080:80"

volumes:
  db-data:
  hatchet-db-data:
  hatchet-config:
  # The agents' root: their working directories, in workdirs (KTD7).
  agent-root:

networks:
  # Internal: the agent worker reaches the engine and the credential proxy,
  # and nothing outside; only the proxy also reaches the outside (KTD24).
  agents:
    internal: true
  # The credential proxy's way out, and no other service's.
  egress:
