# ruff's configuration. The organization's CI reads ruff.toml, never
# [tool.ruff] in pyproject.toml, and takes it from a pull request's base
# commit: a change here applies once it merges.
target-version = "py314"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "TID251"]

# The business logic knows nothing of HTTP, so another interface (a CLI, a
# worker) can call it as it is: only the API imports the web framework.
[lint.flake8-tidy-imports.banned-api]
"fastapi".msg = "Only corvo.server.api imports FastAPI."
"starlette".msg = "Only corvo.server.api imports Starlette."
# Hatchet is the worker's alone, and an interface never imports another.
"hatchet_sdk".msg = "Only corvo.worker imports Hatchet."
"corvo.worker".msg = "Only corvo.worker imports the worker."

[lint.per-file-ignores]
# The tests' entries name both their place on main, tests/{area}, and the one
# they move to, tests/unit/corvo/{area} or tests/integration/corvo/{area}:
# the move's pull request runs on this file, and drops the old ones.
"src/corvo/server/api/**" = ["TID251"]
"tests/server/api/**" = ["TID251"]
"tests/unit/corvo/server/api/**" = ["TID251"]
"src/corvo/worker/**" = ["TID251"]
"tests/worker/**" = ["TID251"]
"tests/unit/corvo/worker/**" = ["TID251"]
"tests/integration/worker/**" = ["TID251"]
"tests/integration/corvo/worker/**" = ["TID251"]
