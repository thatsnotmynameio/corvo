# ruff's configuration. The organization's CI reads ruff.toml, never
# [tool.ruff] in pyproject.toml, and takes it from a pull request's base
# commit: a change here applies once it merges.
target-version = "py314"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "TID251"]

[lint.flake8-tidy-imports.banned-api]
# Hatchet is the worker's alone, through its client in corvo.vendors.hatchet,
# and an interface never imports another.
"hatchet_sdk".msg = "Only corvo.worker and corvo.vendors.hatchet import Hatchet."
"corvo.vendors.hatchet".msg = "Only corvo.worker imports corvo.vendors.hatchet."
"corvo.worker".msg = "Only corvo.worker imports the worker."

# tests/support, the tests' own doubles, sorts with corvo, not with the
# third-party packages: it is no package of the test that imports it.
[lint.isort]
known-first-party = ["support"]

[lint.per-file-ignores]
# The adapter imports Hatchet and its own modules. The exemption lifts its
# corvo.worker ban too, so tests/unit/corvo/test_import_boundaries.py checks
# that it never imports the worker.
"src/corvo/vendors/hatchet/**" = ["TID251"]
"tests/unit/corvo/vendors/hatchet/**" = ["TID251"]
"src/corvo/worker/**" = ["TID251"]
"tests/unit/corvo/worker/**" = ["TID251"]
"tests/integration/corvo/worker/**" = ["TID251"]
