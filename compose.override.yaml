# Development, over compose.yaml: the server reloads on each change, which
# `docker compose watch` syncs into the container, and PostgreSQL is reachable
# from the host. A deploy names its files and leaves this one out:
# docker compose -f compose.yaml up
services:
  db:
    ports:
      - "5432:5432"

  app:
    command: ["sh", "-c", "alembic -c src/corvo/server/database/alembic.ini upgrade head && exec uvicorn corvo.server.api.server:app --host 0.0.0.0 --port 8000 --reload"]
    develop:
      watch:
        - path: ./src
          action: sync
          target: /app/src
        - path: ./pyproject.toml
          action: rebuild
        - path: ./uv.lock
          action: rebuild
