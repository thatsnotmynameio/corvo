# Alembic's configuration, next to the migrations as Prefect keeps it:
# alembic -c src/corvo/server/database/alembic.ini upgrade head
# The database URL comes from CORVO_DATABASE_URL (migrations/env.py).

[alembic]
script_location = %(here)s/migrations

# Each new migration is formatted and linted as the CI checks it.
[post_write_hooks]
hooks = ruff_check, ruff_format

ruff_check.type = exec
ruff_check.executable = uvx
ruff_check.options = ruff check --fix --quiet REVISION_SCRIPT_FILENAME

ruff_format.type = exec
ruff_format.executable = uvx
ruff_format.options = ruff format --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
